<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fortis Key Secured</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: radial-gradient(ellipse at 50% 40%, #1a1a30 0%, #07070f 70%);
        }

        #hex-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .line {
            display: block;
            font-family: 'Arial Black', 'Impact', Arial, sans-serif;
            font-weight: 900;
            color: #ffffff;
            white-space: nowrap;
            line-height: 1;
            text-shadow:
                0 0 60px rgba(255, 165, 20, 0.5),
                0 0 20px rgba(255, 165, 20, 0.25),
                0 2px 10px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>

<body>
    <canvas id="hex-canvas"></canvas>
    <div class="overlay">
        <span class="line" id="fortis" data-text="FORTIS">FORTIS</span>
        <span class="line" id="key-secured" data-text="KEY SECURED">KEY SECURED</span>
    </div>

    <script>
        const canvas = document.getElementById('hex-canvas');
        const ctx = canvas.getContext('2d');
        const fortisEl = document.getElementById('fortis');
        const keySecuredEl = document.getElementById('key-secured');

        function hexPath(cx, cy, r) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = -Math.PI / 2 + (Math.PI / 3) * i;
                const x = cx + r * Math.cos(a);
                const y = cy + r * Math.sin(a);
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.closePath();
        }

        function drawGrid() {
            const W = canvas.width = window.innerWidth;
            const H = canvas.height = window.innerHeight;
            const r = 34;
            const colW = r * Math.sqrt(3);
            const rowH = r * 1.5;

            ctx.clearRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(255, 165, 20, 0.2)';
            ctx.lineWidth = 1;

            const cols = Math.ceil(W / colW) + 2;
            const rows = Math.ceil(H / rowH) + 2;

            for (let row = -1; row < rows; row++) {
                for (let col = -1; col < cols; col++) {
                    const cx = col * colW + (row % 2 !== 0 ? colW / 2 : 0);
                    const cy = row * rowH;
                    hexPath(cx, cy, r);
                    ctx.stroke();
                }
            }
        }

        function fitSize(el, targetPx) {
            // Measure against original text so cipher spans don't skew font sizing
            const text = el.dataset.text || el.textContent;
            const probe = document.createElement('span');
            probe.className = 'line';
            probe.style.cssText = 'visibility:hidden;position:absolute;top:-9999px;white-space:nowrap;pointer-events:none;';
            probe.textContent = text;
            document.body.appendChild(probe);
            let lo = 1, hi = 900;
            while (hi - lo > 1) {
                const mid = (lo + hi) >> 1;
                probe.style.fontSize = mid + 'px';
                el.style.fontSize = mid + 'px';
                if (probe.getBoundingClientRect().width <= targetPx) lo = mid;
                else hi = mid;
            }
            el.style.fontSize = lo + 'px';
            probe.style.fontSize = lo + 'px';
            const w = probe.getBoundingClientRect().width;
            document.body.removeChild(probe);
            return w;
        }

        function fitText() {
            const target = window.innerWidth * 0.30;
            const fortisW = fitSize(fortisEl, target);
            fitSize(keySecuredEl, fortisW);
        }

        function render() {
            drawGrid();
            fitText();
        }

        window.addEventListener('resize', render);
        render();

        // ── Leet cipher animation ────────────────────────────────────────────────
        (function cipherEffect() {
            // Leet substitution map: leet = settled cipher form, noise = shuffle pool
            const CHARS = {
                F: { leet: 'F', noise: ['ƒ', 'φ', 'F', '#', 'Ƒ', 'f'] },
                O: { leet: '0', noise: ['0', 'Θ', 'Ø', 'θ', 'O', '°', 'ø'] },
                R: { leet: 'R', noise: ['R', '®', 'ρ', 'Ʀ', 'r', '2'] },
                T: { leet: '7', noise: ['7', '†', 'τ', '+', 'T', 't', '⊤'] },
                I: { leet: '1', noise: ['1', '!', '|', 'ı', 'I', 'i'] },
                S: { leet: '5', noise: ['5', '$', 'ς', 'ş', 'S', 's'] },
                K: { leet: 'K', noise: ['K', 'κ', 'ĸ', 'k', 'ƙ'] },
                E: { leet: '3', noise: ['3', '€', 'ε', 'ë', 'E', 'e'] },
                Y: { leet: 'Y', noise: ['¥', 'γ', 'ψ', 'Y', 'y'] },
                C: { leet: 'C', noise: ['C', '©', 'ç', '(', 'c', '<'] },
                U: { leet: 'U', noise: ['U', 'υ', 'μ', 'ü', 'u'] },
                D: { leet: 'D', noise: ['D', 'ð', '∂', 'δ', 'd'] },
                ' ': { leet: '\u00a0', noise: ['\u00a0'] }
            };

            const rand = (a, b) => a + Math.random() * (b - a);
            const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

            function buildSpans(el) {
                const text = el.dataset.text || el.textContent.trim();
                el.textContent = '';
                el.style.display = 'inline-flex';
                return Array.from(text, ch => {
                    const d = CHARS[ch] ?? { leet: ch, noise: [ch] };
                    const span = document.createElement('span');
                    span.style.cssText = 'display:inline-block;text-align:center;';
                    span.textContent = d.leet;
                    el.appendChild(span);
                    return { span, ch, d };
                });
            }

            function animate({ span, ch, d }) {
                // Static characters (space, no meaningful noise)
                if (d.noise.length === 1) { span.textContent = d.leet; return; }

                function scramble(frames, done) {
                    if (frames <= 0) return done();
                    span.textContent = pick(d.noise);
                    setTimeout(() => scramble(frames - 1, done), rand(600, 1215));
                }

                function holdLeet() {
                    span.textContent = d.leet;
                    // Hold the cipher form, then briefly scramble
                    setTimeout(() => {
                        scramble(4 + Math.floor(rand(0, 9)), () => {
                            if (Math.random() < 0.18) {
                                // Briefly reveal the clear letter
                                span.textContent = ch;
                                setTimeout(
                                    () => scramble(4 + Math.floor(rand(0, 9)), holdLeet),
                                    rand(350, 1200)
                                );
                            } else {
                                holdLeet();
                            }
                        });
                    }, rand(900, 4200));
                }

                // Stagger start times so characters don't all fire at once
                setTimeout(holdLeet, rand(0, 2000));
            }

            [
                ...buildSpans(document.getElementById('fortis')),
                ...buildSpans(document.getElementById('key-secured'))
            ].forEach(animate);
        }());
    </script>
</body>

</html>
